<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beauty Gallery</title>
    <script src="./index.js" defer></script>
    <style>
        :root {
            color-scheme: light;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            --bg: #efede6;
            --panel: rgba(255, 252, 247, 0.78);
            --border: rgba(49, 42, 34, 0.12);
            --text: #221d18;
            --muted: #6e655d;
            --shadow: 0 18px 48px rgba(34, 29, 24, 0.14);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            background:
                radial-gradient(circle at top left, rgba(255, 255, 255, 0.9), transparent 26%),
                linear-gradient(180deg, #f5f2eb, #e8e1d7);
            color: var(--text);
        }

        body {
            overflow: hidden;
        }

        body.modal-open {
            overflow: hidden;
        }

        button {
            font: inherit;
        }

        .surface-shell {
            position: relative;
            height: 100vh;
            overflow: hidden;
        }

        .surface-toolbar {
            position: fixed;
            top: 16px;
            left: 16px;
            right: 16px;
            z-index: 30;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            pointer-events: none;
        }

        .surface-toolbar > * {
            pointer-events: auto;
        }

        .toolbar-card {
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 10px 14px;
            background: var(--panel);
            backdrop-filter: blur(18px);
            box-shadow: var(--shadow);
        }

        .toolbar-card.is-hidden {
            display: none;
        }

        .toolbar-title {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .toolbar-title strong {
            font-size: 15px;
            font-weight: 700;
        }

        .toolbar-title span {
            color: var(--muted);
            font-size: 12px;
        }

        .toolbar-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toolbar-controls.is-modal {
            margin-left: auto;
        }

        .toolbar-controls .zoom-label {
            min-width: 52px;
            text-align: center;
            color: var(--muted);
            font-size: 13px;
            font-variant-numeric: tabular-nums;
        }

        .tool-button {
            border: 1px solid rgba(34, 29, 24, 0.12);
            border-radius: 12px;
            padding: 9px 12px;
            background: rgba(255, 255, 255, 0.9);
            color: var(--text);
            cursor: pointer;
            transition: transform 0.16s ease, background 0.16s ease;
        }

        .tool-button:hover,
        .tool-button:focus-visible {
            background: #fff;
            transform: translateY(-1px);
        }

        .tool-button:focus-visible {
            outline: 2px solid #1f1a15;
            outline-offset: 2px;
        }

        .tool-button.is-strong {
            background: rgba(34, 29, 24, 0.92);
            color: #fff;
        }

        .tool-button.is-icon {
            min-width: 44px;
            padding-inline: 0;
            font-size: 22px;
            line-height: 1;
        }

        .tool-button.is-quiet {
            padding: 6px 10px;
            background: transparent;
            color: var(--muted);
            box-shadow: none;
        }

        .tool-button.is-quiet:hover,
        .tool-button.is-quiet:focus-visible {
            background: rgba(255, 255, 255, 0.72);
            transform: none;
        }

        .surface-viewport {
            position: absolute;
            inset: 0;
            overflow-x: hidden;
            overflow-y: auto;
            touch-action: pan-y pinch-zoom;
            cursor: default;
            overscroll-behavior: contain;
            background:
                linear-gradient(90deg, rgba(255, 255, 255, 0.22) 1px, transparent 1px),
                linear-gradient(rgba(255, 255, 255, 0.2) 1px, transparent 1px);
            background-size: 28px 28px;
            background-position: center;
        }

        .modal-layer.is-slideshow .surface-viewport {
            overflow: hidden;
            touch-action: none;
            cursor: grab;
        }

        .modal-layer.is-slideshow .surface-viewport.is-dragging {
            cursor: grabbing;
        }

        .surface-canvas {
            position: absolute;
            inset: 0 auto auto 0;
            transform-origin: 0 0;
            will-change: transform;
        }

        .surface-canvas.is-empty {
            display: flex;
            align-items: center;
            justify-content: center;
            inset: 0;
        }

        .modal-layer {
            position: fixed;
            inset: 0;
            z-index: 999;
            display: none;
            background: rgba(243, 238, 231, 0.86);
            backdrop-filter: blur(14px);
            transition: background 0.28s ease, backdrop-filter 0.28s ease;
        }

        .modal-layer.is-open {
            display: block;
        }

        .modal-close-button {
            display: none;
        }

        .modal-layer.is-slideshow .modal-close-button {
            display: inline-flex;
        }

        .modal-layer.is-slideshow .modal-back-button {
            display: inline-flex;
        }

        .modal-layer.is-slideshow {
            background:
                radial-gradient(circle at top left, rgba(255, 223, 214, 0.5), transparent 30%),
                radial-gradient(circle at top right, rgba(221, 225, 255, 0.46), transparent 32%),
                linear-gradient(180deg, rgba(213, 218, 212, 0.94), rgba(208, 214, 211, 0.92));
            backdrop-filter: blur(20px);
        }

        .modal-layer.is-slideshow .surface-toolbar {
            left: 18px;
            right: 18px;
            align-items: flex-start;
        }

        .modal-layer.is-slideshow .toolbar-card {
            padding: 0;
            background: transparent;
            border: 0;
            box-shadow: none;
            backdrop-filter: none;
        }

        .modal-layer.is-slideshow .toolbar-controls.is-modal {
            width: 100%;
            justify-content: space-between;
        }

        .modal-layer.is-slideshow .tool-button {
            border: 0;
            background: rgba(255, 255, 255, 0.18);
            color: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(14px);
        }

        .modal-layer.is-slideshow .tool-button:hover,
        .modal-layer.is-slideshow .tool-button:focus-visible {
            background: rgba(255, 255, 255, 0.26);
        }

        .modal-layer.is-slideshow .modal-back-button {
            padding: 0 8px;
            background: transparent;
            color: rgba(255, 255, 255, 0.9);
            font-size: 34px;
            backdrop-filter: none;
        }

        .modal-layer.is-slideshow .modal-back-button:hover,
        .modal-layer.is-slideshow .modal-back-button:focus-visible {
            background: transparent;
            color: #fff;
            transform: translateX(-2px);
        }

        .modal-layer.is-slideshow .modal-close-button {
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.14);
            color: rgba(255, 255, 255, 0.94);
        }

        .modal-layer.is-slideshow .surface-viewport {
            background: transparent;
            transition: background 0.28s ease;
        }

        .slideshow-counter {
            display: none;
        }

        .card {
            position: absolute;
            overflow: hidden;
            border-radius: 16px;
            background: #ddd;
            box-shadow: 0 12px 34px rgba(28, 23, 18, 0.14);
            user-select: none;
            -webkit-user-drag: none;
            contain: layout paint;
        }

        .modal-layer .card {
            transition:
                left 0.28s cubic-bezier(0.22, 1, 0.36, 1),
                top 0.28s cubic-bezier(0.22, 1, 0.36, 1),
                width 0.28s cubic-bezier(0.22, 1, 0.36, 1),
                height 0.28s cubic-bezier(0.22, 1, 0.36, 1),
                border-radius 0.24s ease,
                box-shadow 0.24s ease,
                background 0.24s ease;
        }

        .card::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            box-shadow: inset 0 0 0 0 var(--card-accent, transparent);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.16s ease, box-shadow 0.16s ease;
        }

        .card img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #ece7e0;
            pointer-events: none;
        }

        .modal-layer .card img {
            transition: filter 0.24s ease, opacity 0.24s ease, transform 0.28s ease;
        }

        .album-card {
            cursor: pointer;
        }

        .album-card:hover,
        .album-card:focus-visible {
            outline: none;
        }

        .album-card:hover::after,
        .album-card:focus-visible::after {
            opacity: 1;
            box-shadow:
                inset 0 0 0 4px var(--card-accent, #fff),
                inset 0 0 0 7px rgba(255, 255, 255, 0.24);
        }

        .card-overlay {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 28px 14px 14px;
            background: linear-gradient(to top, rgba(17, 14, 10, 0.76), rgba(17, 14, 10, 0));
        }

        .card-title {
            margin: 0;
            color: #fff;
            font-size: 14px;
            line-height: 1.4;
            text-shadow: 0 1px 8px rgba(0, 0, 0, 0.25);
        }

        .modal-title {
            position: absolute;
            top: 18px;
            left: 22px;
            right: 22px;
            z-index: 20;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.01em;
            pointer-events: none;
            transition: color 0.24s ease, text-shadow 0.24s ease, opacity 0.24s ease;
        }

        .modal-layer.is-slideshow .modal-title {
            opacity: 0;
        }

        .modal-layer.is-slideshow-settled .card {
            background: transparent;
            box-shadow: none;
        }

        .modal-layer.is-slideshow-settled .card img {
            object-fit: contain;
            background: transparent;
        }

        .viewer-root {
            position: absolute;
            inset: 0;
        }

        .slideshow-backdrop {
            position: absolute;
            inset: -40px;
            opacity: 0;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            filter: blur(56px) saturate(1.08);
            transform: scale(1.08);
            transition: opacity 0.24s ease;
            pointer-events: none;
        }

        .modal-layer.is-slideshow .slideshow-backdrop {
            opacity: 0.34;
        }

        .viewer-slot {
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 18px 46px rgba(33, 34, 42, 0.12);
            transform-origin: 0 0;
            will-change: transform;
            border-radius: 8px;
            transition:
                left 0.28s cubic-bezier(0.22, 1, 0.36, 1),
                top 0.28s cubic-bezier(0.22, 1, 0.36, 1),
                width 0.28s cubic-bezier(0.22, 1, 0.36, 1),
                height 0.28s cubic-bezier(0.22, 1, 0.36, 1),
                transform 0.22s cubic-bezier(0.22, 1, 0.36, 1),
                opacity 0.22s ease,
                filter 0.22s ease;
        }

        .viewer-slot.is-adjacent {
            opacity: 0;
            filter: saturate(0.92) brightness(0.94);
        }

        .viewer-slot.is-current {
            z-index: 2;
            opacity: 1;
            filter: none;
        }

        .viewer-root.is-shifting .viewer-slot {
            transition:
                transform 0.22s cubic-bezier(0.22, 1, 0.36, 1),
                opacity 0.16s ease,
                filter 0.16s ease;
        }

        .viewer-root.is-swiping .viewer-slot.is-adjacent,
        .viewer-root.is-shifting .viewer-slot.is-adjacent {
            opacity: 0.6;
        }

        .viewer-slot.is-hidden,
        .viewer-slot.is-entry-hidden {
            opacity: 0;
            pointer-events: none;
        }

        .viewer-slot img {
            object-fit: contain;
            background: transparent;
        }

        .slideshow-nav {
            position: absolute;
            top: 50%;
            z-index: 24;
            display: none;
            align-items: center;
            justify-content: center;
            width: 84px;
            height: 84px;
            margin-top: -42px;
            border: 0;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.14);
            color: rgba(85, 86, 95, 0.55);
            font-size: 86px;
            line-height: 0.7;
            cursor: pointer;
            backdrop-filter: blur(14px);
            transition: background 0.18s ease, color 0.18s ease, transform 0.18s ease;
        }

        .slideshow-nav:hover,
        .slideshow-nav:focus-visible {
            background: rgba(255, 255, 255, 0.22);
            color: rgba(85, 86, 95, 0.78);
            transform: translateY(-2px);
        }

        .slideshow-nav.is-prev {
            left: 18px;
        }

        .slideshow-nav.is-next {
            right: 18px;
        }

        .modal-layer.is-slideshow .slideshow-nav {
            display: inline-flex;
        }

        .slideshow-filmstrip {
            position: absolute;
            left: 18px;
            right: 18px;
            bottom: 14px;
            z-index: 24;
            display: none;
            padding: 10px 12px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(16px);
            box-shadow: 0 20px 48px rgba(58, 63, 70, 0.12);
        }

        .modal-layer.is-slideshow .slideshow-filmstrip {
            display: block;
        }

        .slideshow-thumbs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .slideshow-thumbs::-webkit-scrollbar {
            display: none;
        }

        .slideshow-thumb {
            flex: 0 0 auto;
            width: 56px;
            height: 74px;
            padding: 0;
            border: 3px solid transparent;
            border-radius: 4px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.26);
            cursor: pointer;
            transition: transform 0.16s ease, border-color 0.16s ease, opacity 0.16s ease;
        }

        .slideshow-thumb:hover,
        .slideshow-thumb:focus-visible {
            transform: translateY(-2px);
            opacity: 1;
        }

        .slideshow-thumb.is-active {
            border-color: #ff5f9a;
        }

        .slideshow-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .app-message {
            max-width: 620px;
            padding: 32px 28px;
            border: 1px solid var(--border);
            border-radius: 24px;
            background: rgba(255, 253, 249, 0.9);
            box-shadow: var(--shadow);
            text-align: center;
        }

        .app-message h2 {
            margin: 0 0 12px;
            font-size: 26px;
        }

        .app-message p {
            margin: 0;
            color: var(--muted);
            line-height: 1.7;
        }

        @media (max-width: 720px) {
            .surface-toolbar {
                top: 12px;
                left: 12px;
                right: 12px;
                flex-direction: column;
                align-items: stretch;
            }

            .toolbar-card {
                justify-content: space-between;
                gap: 12px;
            }

            .toolbar-controls {
                flex-wrap: wrap;
                justify-content: flex-end;
            }

            .toolbar-title span {
                display: none;
            }

            .modal-title {
                font-size: 18px;
            }

            .slideshow-nav {
                width: 58px;
                height: 58px;
                margin-top: -29px;
                font-size: 58px;
            }

            .slideshow-filmstrip {
                left: 12px;
                right: 12px;
                bottom: 10px;
            }

            .slideshow-thumb {
                width: 48px;
                height: 64px;
            }
        }
    </style>
</head>
<body>
    <main class="surface-shell">
        <div class="surface-toolbar">
            <div id="app-tip" class="toolbar-card">
                <div class="toolbar-title">
                    <strong>Beauty Gallery</strong>
                    <span>滚动浏览图集，点击卡片进入图集</span>
                </div>
                <button id="app-tip-close" class="tool-button is-quiet" type="button" aria-label="Close tips">✕</button>
            </div>
        </div>
        <div id="app-viewport" class="surface-viewport" aria-label="Gallery canvas">
            <div id="app-canvas" class="surface-canvas"></div>
        </div>
    </main>

    <div id="modal" class="modal-layer" aria-hidden="true">
        <div class="surface-toolbar">
            <div class="toolbar-card toolbar-controls is-modal" data-surface-controls="modal">
                <span id="modal-slide-counter" class="slideshow-counter">1 / 1</span>
                <button id="modal-back" class="tool-button is-icon modal-back-button" type="button" aria-label="Back to gallery">‹</button>
                <button id="modal-close" class="tool-button is-strong modal-close-button" type="button" aria-label="Close gallery">Close</button>
            </div>
        </div>
        <div id="modal-title" class="modal-title"></div>
        <div id="modal-viewport" class="surface-viewport" aria-label="Album canvas">
            <div id="modal-slideshow-backdrop" class="slideshow-backdrop" aria-hidden="true"></div>
            <div id="modal-canvas" class="surface-canvas"></div>
        </div>
        <button class="slideshow-nav is-prev" type="button" data-action="prev-slide" data-target="modal" aria-label="Previous image">‹</button>
        <button class="slideshow-nav is-next" type="button" data-action="next-slide" data-target="modal" aria-label="Next image">›</button>
        <div class="slideshow-filmstrip" aria-hidden="true">
            <div id="modal-thumb-track" class="slideshow-thumbs"></div>
        </div>
    </div>
</body>
</html>
